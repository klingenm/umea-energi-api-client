<label>
  <span>Customer type</span>
  <select name="state">
    {% for option in login_states %}
    <option value="{{ option.value }}" {% if option.value == (state or 0) %}selected{% endif %}>
      {{ "Company" if option.value == 1 else "Private person" }}
    </option>
    {% endfor %}
  </select>
</label>
