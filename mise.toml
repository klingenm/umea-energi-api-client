min_version = "2026.9.0"

[tools]
python = "3.14"
uv = "0.13"
ruff = "0.17"
"pipx:openapi-python-client" = "0.29"
"github:knope-dev/knope" = { version = "0.23", version_prefix = "knope/v" }

[env]
# Make uv use the mise-managed interpreter instead of downloading its own.
UV_PYTHON_PREFERENCE = "only-system"
UV_PYTHON_DOWNLOADS = "never"
# `uv check` (ty type checking) is a preview feature.
UV_PREVIEW_FEATURES = "check-command"

[settings]
# Activate the uv-managed .venv whenever mise is active in this directory.
python.uv_venv_auto = true

[tasks.sync]
description = "Install all workspace packages and dev dependencies into .venv"
run = "uv sync --all-packages --all-groups"

[tasks.format]
description = "Format code and apply safe lint fixes"
run = ["ruff format", "ruff check --fix"]

[tasks.lint]
description = "Check formatting and lint"
run = ["ruff format --check", "ruff check"]

[tasks.typecheck]
depends = ["generate"]
description = "Type-check with ty (via uv check)"
run = "uv check --all-packages --ty-version 0.0.91"

[tasks.test]
depends = ["generate"]
description = "Run the test suite"
run = "uv run --all-packages pytest"

[tasks.check]
description = "Run lint, typecheck and tests"
depends = ["lint", "typecheck", "test"]

[tasks.fetch-spec]
description = "Download the latest OpenAPI document into the api-client package"
dir = "packages/api-client"
run = "curl -fsSL https://tapi.umeaenergi.se/swagger/v2/swagger.json -o openapi/swagger.json"

[tasks.generate]
description = "Regenerate the API client from packages/api-client/openapi/swagger.json"
dir = "packages/api-client"
sources = ["openapi/swagger.json", "openapi/config.yaml", "scripts/normalize_openapi.py"]
outputs = ["src/umea_energi_api_client/generated/__init__.py"]
run = """
python -I scripts/normalize_openapi.py openapi/swagger.json build/openapi.normalized.json
openapi-python-client generate \
  --path build/openapi.normalized.json \
  --config openapi/config.yaml \
  --meta none \
  --output-path src/umea_energi_api_client/generated \
  --overwrite
"""

[tasks.playground]
description = "Run the playground on http://127.0.0.1:8000 (applies migrations on startup)"
depends = ["generate"]
dir = "packages/playground"
run = "uv run --package umea-energi-playground uvicorn umea_energi_playground.app:create_app --factory --reload --host 127.0.0.1 --port 8000"

[tasks."playground:migrate"]
description = "Apply playground database migrations"
depends = ["generate"]
dir = "packages/playground"
run = "uv run --package umea-energi-playground alembic -c pyproject.toml upgrade head"

[tasks."playground:revision"]
description = "Autogenerate a playground migration from model changes, e.g. -- -m \"add column\""
depends = ["playground:migrate"]
dir = "packages/playground"
run = "uv run --package umea-energi-playground alembic -c pyproject.toml revision --autogenerate"

[tasks.change]
description = "Add a change file (.changeset/) describing a user-facing change"
run = "knope document-change"

[tasks.release]
description = "Release pending changesets: bump version, changelog, push, GitHub release → PyPI"
# Extra args go to knope, e.g. `mise run release -- --dry-run`.
run = '''
test "$(git branch --show-current)" = main || { echo "Releases are made from main." >&2; exit 1; }
git diff --quiet HEAD || { echo "Commit or stash your changes first." >&2; exit 1; }
git fetch --quiet && test "$(git rev-parse HEAD)" = "$(git rev-parse @{u})" || { echo "main is not in sync with origin/main." >&2; exit 1; }
GITHUB_TOKEN="${GITHUB_TOKEN:-$(gh auth token)}" knope release
'''

[tasks.build]
depends = ["generate"]
description = "Build the api-client sdist and wheel into dist/"
run = "uv build --package umea-energi-api-client"
