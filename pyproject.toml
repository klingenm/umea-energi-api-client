[project]
name = "umea-energi-api-client"
version = "0.1.0"
description = "Python client for the Umeå Energi API"
readme = "README.md"
authors = [
    { name = "Magnus Klingenberg", email = "klingenberg.magnus@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "attrs>=26.1.0",
    "httpx>=0.28.1",
]

[project.urls]
Repository = "https://github.com/klingenm/umea-energi-api-client"
Issues = "https://github.com/klingenm/umea-energi-api-client/issues"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Generated by openapi-python-client (`mise run generate`); formatted but not linted.
exclude = ["src/umea_energi_api_client/generated/**"]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
# Keeps import order stable whether or not generated/ exists yet.
known-first-party = ["umea_energi_api_client"]

[tool.ty.src]
include = ["src", "tests", "scripts"]

[tool.ty.terminal]
error-on-warning = true

[tool.pytest]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
