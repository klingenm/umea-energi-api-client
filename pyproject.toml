# uv workspace root. Packages live in packages/; this file holds shared dev tooling config.

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.ruff]
line-length = 100
# The workspace root has no requires-python for ruff to infer this from.
target-version = "py314"

[tool.ruff.lint]
# Generated by openapi-python-client (`mise run generate`); formatted but not linted.
exclude = ["packages/api-client/src/umea_energi_api_client/generated/**"]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
# Keeps import order stable whether or not generated/ exists yet.
known-first-party = ["umea_energi_api_client", "umea_energi_playground"]

[tool.ty.src]
include = ["packages/*/src", "packages/*/tests", "packages/*/scripts"]

[tool.ty.terminal]
error-on-warning = true

[tool.pytest]
testpaths = ["packages/*/tests"]
addopts = ["--import-mode=importlib"]
