[project]
name = "umea-energi-api-client"
version = "0.1.0"
description = "Python client for the Umeå Energi API"
readme = "README.md"
authors = [
    { name = "Magnus Klingenberg", email = "klingenberg.magnus@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
files = ["src", "tests"]
strict = true

[tool.pytest]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
